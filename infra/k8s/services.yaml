# Application services. Images are built locally: see infra/k8s/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: minimarket
spec:
  replicas: 1
  selector:
    matchLabels: { app: catalog-service }
  template:
    metadata:
      labels: { app: catalog-service }
    spec:
      containers:
        - name: catalog-service
          image: minimarket/catalog-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8081 }]
          env:
            - { name: SERVER_PORT, value: "8081" }
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres-catalog:5432/catalogdb" }
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: db-credentials, key: catalog-user } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: catalog-password } }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 40
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: minimarket
spec:
  selector: { app: catalog-service }
  ports: [{ port: 8081 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: minimarket
spec:
  replicas: 1
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      containers:
        - name: order-service
          image: minimarket/order-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8082 }]
          env:
            - { name: SERVER_PORT, value: "8082" }
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres-order:5432/orderdb" }
            - name: SPRING_DATASOURCE_USERNAME
