server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: user-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # Only the signature is checked via the realm JWKS (override with the in-network URL in docker).
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8180/realms/minimarket/protocol/openid-connect/certs}

minimarket:
  keycloak:
    url: ${KEYCLOAK_URL:http://localhost:8180}
    realm: minimarket
    client-id: minimarket-user-service
    # DEV secret, imported with the realm. Provide a real one through the environment elsewhere.
    client-secret: ${KEYCLOAK_CLIENT_SECRET:dev-user-service-secret}
    customer-role: customer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.minimarket: DEBUG
