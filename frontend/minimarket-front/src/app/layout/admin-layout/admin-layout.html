<div class="shell">
  <header class="top">
    <button type="button" class="burger" aria-label="Menu" (click)="menuOpen.set(!menuOpen())">
      <span class="material-icons">menu</span>
    </button>
    <span class="brand">Mini<b>Market</b> <small>Admin</small></span>
    <span class="spacer"></span>
    <a class="plain" routerLink="/" target="_blank" rel="noopener">Voir la boutique <span class="material-icons">open_in_new</span></a>
    <span class="user"><span class="material-icons">account_circle</span>{{ auth.username() }}</span>
    <button type="button" class="logout" (click)="auth.logout()">Déconnexion</button>
  </header>

  <div class="body">
    <nav class="side" [class.open]="menuOpen()">
      @for (l of links; track l.path) {
        <a [routerLink]="l.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: l.exact }"
           (click)="menuOpen.set(false)">
          <span class="material-icons">{{ l.icon }}</span>{{ l.label }}
        </a>
      }
    </nav>
    <main class="content"><router-outlet /></main>
  </div>
</div>
