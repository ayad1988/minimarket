@if (totalPages() > 1) {
  <nav class="pager" aria-label="Pagination">
    <button type="button" (click)="go(page() - 1)" [disabled]="page() === 0">‹ Précédent</button>
    @for (p of items(); track $index) {
      @if (p === -1) {
        <span class="gap">…</span>
      } @else {
        <button type="button" [class.current]="p === page()" [attr.aria-current]="p === page() ? 'page' : null"
                (click)="go(p)">{{ p + 1 }}</button>
      }
    }
    <button type="button" (click)="go(page() + 1)" [disabled]="page() + 1 >= totalPages()">Suivant ›</button>
  </nav>
}
